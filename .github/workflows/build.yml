name: Build & Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Installer (NSIS)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List dist artifacts
        run: Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Upload Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: Otimizador-Setup-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Otimizador & Gaming Hub Pro ${{ github.ref_name }}"
          body: |
            ## 🎮 Otimizador & Gaming Hub Pro ${{ github.ref_name }}

            ### Download
            Baixe o instalador abaixo e execute como Administrador.

            ### O que inclui
            - 🖥️ Dashboard de Hardware em tempo real (CPU, GPU, RAM, Disco)
            - 🎮 Runtimes de Jogos: DirectX, Visual C++ All-in-One, .NET 8, Vulkan, OpenAL
            - 🔧 Central de Drivers: GPU (NVIDIA/AMD/Intel), Chipset, Rede, USB
            - 📦 Central de Aplicativos: Brave, Chrome, WinRAR, 7-Zip, VS Code, Git, Docker, Steam, Discord, Epic Games
            - 🧹 Otimizador: TRIM SSD, Limpeza de Cache, Flush DNS, Purga RAM
            - 🛡️ Windows Defender Toggle + Modo Game (Ultimate Performance, MMCSS, etc.)
            - 🔍 Anti-Miner: varredura de processos e tarefas ocultas
          files: |
            dist/*.exe
            dist/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
